name: filter

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  MY_USER_ID: ${{ secrets.MY_USER_ID }}
  AI_API: ${{ secrets.AI_API }}
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run filter
        run: python3 filter.py

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state.json || true
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "state update [skip ci]"
          git push || true
